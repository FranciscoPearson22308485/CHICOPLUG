<div class="flex flex-col items-center justify-center border border-dashed border-border px-6 py-24 text-center">
  <div class="mb-6 h-px w-10 bg-brand"></div>
  <h3 class="text-2xl">{{ titulo }}</h3>
  <p class="mt-3 max-w-sm text-sm leading-relaxed text-muted-foreground">{{ descricao }}</p>
  {% if url_accao %}
    <a href="{{ url_accao }}" class="mt-8 bg-foreground px-8 py-4 text-[11px] font-semibold uppercase tracking-[0.2em] text-background">{{ texto_accao }}</a>
  {% endif %}
</div>
