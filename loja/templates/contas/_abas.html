<div class="reveal grid grid-cols-[minmax(0,1fr)_auto] items-end gap-6">
  <div class="min-w-0">
    <p class="eyebrow">Área do cliente</p>
    <h1 class="mt-5 text-5xl sm:text-6xl">A tua conta</h1>
    {% if user.is_authenticated %}
      <p class="mt-4 truncate text-[11px] uppercase tracking-[0.16em] text-muted-foreground">{{ user.nome_completo }} · {{ user.email }}</p>
    {% endif %}
  </div>
  <a href="{% url 'contas:sair' %}" class="inline-flex shrink-0 items-center gap-2 border border-border px-5 py-3 text-[11px] font-semibold uppercase tracking-[0.18em] transition-colors hover:border-foreground">Sair</a>
</div>

<div class="no-scrollbar mt-14 flex gap-8 overflow-x-auto border-b border-border">
  <a href="{% url 'contas:perfil' %}" class="whitespace-nowrap pb-4 text-[11px] font-semibold uppercase tracking-[0.2em] {% if activa == 'perfil' %}border-b border-foreground text-foreground{% else %}text-muted-foreground hover:text-foreground{% endif %}">Perfil</a>
  <a href="{% url 'encomendas:minhas' %}" class="whitespace-nowrap pb-4 text-[11px] font-semibold uppercase tracking-[0.2em] {% if activa == 'encomendas' %}border-b border-foreground text-foreground{% else %}text-muted-foreground hover:text-foreground{% endif %}">Encomendas</a>
  <a href="{% url 'contas:favoritos' %}" class="whitespace-nowrap pb-4 text-[11px] font-semibold uppercase tracking-[0.2em] {% if activa == 'favoritos' %}border-b border-foreground text-foreground{% else %}text-muted-foreground hover:text-foreground{% endif %}">Favoritos</a>
  <a href="{% url 'contas:moradas' %}" class="whitespace-nowrap pb-4 text-[11px] font-semibold uppercase tracking-[0.2em] {% if activa == 'moradas' %}border-b border-foreground text-foreground{% else %}text-muted-foreground hover:text-foreground{% endif %}">Moradas</a>
</div>
