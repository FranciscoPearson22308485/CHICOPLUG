{% extends "base.html" %}
{% block titulo %}Alterar password — CHICOPLUG{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow" />{% endblock %}

{% block conteudo %}
<div class="shell pb-28 pt-16 md:pt-24">
  <div class="reveal mx-auto w-full max-w-md">
    <p class="eyebrow">Segurança</p>
    <h1 class="mt-5 text-5xl sm:text-6xl">Alterar password</h1>
    
    <div class="mt-12"><form method="post" class="space-y-6">
      {% csrf_token %}
      {{ formulario.as_p }}
      <button type="submit" class="w-full bg-foreground py-5 text-[11px] font-semibold uppercase tracking-[0.24em] text-background transition-colors hover:bg-brand hover:text-brand-foreground">Guardar</button>
    </form></div>
    
  </div>
</div>
{% endblock %}
