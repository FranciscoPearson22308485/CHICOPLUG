{% extends "painel/base.html" %}
{% block accao %}
  <a href="{% url 'painel:categoria_nova' %}" class="border border-foreground bg-foreground px-6 py-3 text-[11px] font-semibold uppercase tracking-[0.2em] text-background transition-colors hover:border-brand hover:bg-brand hover:text-brand-foreground">Nova categoria</a>
{% endblock %}
{% block painel %}
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    {% for c in categorias %}
      <div class="border border-border bg-background p-6">
        <p class="text-sm font-semibold">{{ c.nome }}</p>
        <p class="mt-2 text-[11px] uppercase tracking-[0.16em] text-muted-foreground">{{ c.total_pecas }} peças</p>
        <p class="mt-2 text-[10px] uppercase tracking-[0.16em] {% if c.activa %}text-brand{% else %}text-muted-foreground{% endif %}">{% if c.activa %}Activa{% else %}Inactiva{% endif %}</p>
        <div class="mt-5 flex gap-4 border-t border-border pt-4 text-[11px] uppercase tracking-[0.16em]">
          <a href="{% url 'painel:categoria_editar' c.pk %}" class="link-underline font-semibold">Editar</a>
          <form method="post" action="{% url 'painel:categoria_remover' c.pk %}" onsubmit="return confirm('Remover a categoria {{ c.nome|escapejs }}?')">
            {% csrf_token %}
            <button type="submit" class="link-underline text-destructive">Remover</button>
          </form>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
